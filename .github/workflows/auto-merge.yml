name: auto-merge
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] no untrusted code runs here; only metadata is read and native auto-merge is armed. review is done by CodeRabbit + ci.
    types: [labeled, synchronize]
permissions: {}
# a newer event for the same PR supersedes an in-flight run.
concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  # any push VOIDS prior authorization: disable auto-merge and drop the label.
  # never checks out or runs head code. re-authorize (label or /auto-merge) to
  # re-arm on the new head. closes the label-then-swap TOCTOU.
  deauthorize-on-push:
    if: github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: void authorization on new commits
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge "$PR" --repo "$REPO" --disable-auto || true
          had_label="$(gh pr view "$PR" --repo "$REPO" --json labels --jq 'any(.labels[]; .name=="auto-merge")' 2>/dev/null || echo false)"
          if [ "$had_label" = "true" ]; then
            gh pr edit "$PR" --repo "$REPO" --remove-label auto-merge || true
            gh pr comment "$PR" --repo "$REPO" --body \
              "new commits were pushed after authorization. auto-merge is disarmed and the label removed — re-add the auto-merge label (or comment /auto-merge) to re-arm on the new head."
          fi

  guard:
    # only a FRESH label arms auto-merge, and only from the trusted owner.
    if: github.event.action == 'labeled' && github.event.label.name == 'auto-merge'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      klass: ${{ steps.classify.outputs.klass }}
    steps:
      - name: the labeler must be the trusted owner (fail closed)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          if [ "$SENDER" != "plind-junior" ]; then
            echo "::error::auto-merge label applied by an untrusted actor ($SENDER)"
            gh pr edit "$PR" --repo "$REPO" --remove-label auto-merge || true
            exit 1
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: classify
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # REST files endpoint carries previous_filename on renames; the
          # GraphQL-backed `gh pr view --json files` shortcut does not.
          gh api "repos/$REPO/pulls/$PR/files" --paginate > files.json
          PYTHONPATH=src python -m vouch.pr_bot changed-files --json-file files.json > changed.txt
          klass=$(PYTHONPATH=src python -m vouch.pr_bot classify --files-file changed.txt --print-klass)
          echo "klass=$klass" >> "$GITHUB_OUTPUT"

  arm:
    needs: guard
    # core PRs are never armed — CODEOWNERS requires the owner's approval.
    if: needs.guard.outputs.klass != 'core'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      # the coverage bar, read as metadata from ci's own run — never recomputed
      # here, because that would mean executing PR code in a workflow that holds
      # a write token. refuses to arm unless the `diff coverage` check passed on
      # THIS head sha, so "fully covered" is a precondition of arming.
      - name: require the diff-coverage check to have passed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          conclusion=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs" --paginate \
            --jq '[.check_runs[] | select(.name | startswith("diff coverage"))]
                  | sort_by(.completed_at) | last | .conclusion' 2>/dev/null || true)
          if [ "$conclusion" != "success" ]; then
            echo "::error::diff coverage is not green on $HEAD_SHA (conclusion=${conclusion:-missing}); refusing to arm auto-merge"
            gh pr edit "$PR" --repo "$REPO" --remove-label auto-merge || true
            gh pr comment "$PR" --repo "$REPO" --body \
              "auto-merge was not armed: the \`diff coverage\` check is not green on this head. every python line this PR changes under \`src/vouch/\` must be executed by a test. the bot has commented the uncovered lines; push tests and re-add the auto-merge label."
            exit 1
          fi

      - name: arm native auto-merge (non-core)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge "$PR" --repo "$REPO" --auto --squash
